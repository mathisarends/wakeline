[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "wakeline"
version = "0.1.0"
description = "A small asyncio coordination layer for scheduled wakeups."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mathisarends" }]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["cronsim>=2.7,<3", "tzdata>=2025.2; sys_platform == 'win32'"]

[project.urls]
Documentation = "https://github.com/mathisarends/wakeline/blob/main/docs/index.md"
Repository = "https://github.com/mathisarends/wakeline"
Issues = "https://github.com/mathisarends/wakeline/issues"
Changelog = "https://github.com/mathisarends/wakeline/blob/main/docs/releases.md"

[project.optional-dependencies]
sqlite = [] # Uses sqlite3 from the standard library, off the event loop.
postgres = ["asyncpg>=0.30,<1"]

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.14,<1",
    "twine>=6.2,<7",
    "ty>=0.0.1,<0.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["wakeline*"]

[tool.setuptools.package-data]
wakeline = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = ["postgres: requires WAKELINE_POSTGRES_DSN"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID252", "PLC0415"]
ignore = ["ASYNC109"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
"wakeline/stores/postgres.py" = ["PLC0415"]
"tests/**/*.py" = ["PLC0415"]

[tool.ty.environment]
python-version = "3.12"
python-platform = "all"

[tool.ty.src]
include = ["wakeline", "examples", "scripts", "tests/typing"]

[tool.ty.rules]
unused-ignore-comment = "error"
